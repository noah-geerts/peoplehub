<div class="card-row">
  <div class="card-wrapper">
    <app-card [loading]="employeesVM().loading">
      <p>{{ employeesVM().data?.length }} Employees</p>
    </app-card>
  </div>
  <div class="card-wrapper">
    <app-card [loading]="employeesVM().loading">
      <p>{{ avgSalary() | number: '1.0-2' }}$ Average Salary</p>
    </app-card>
  </div>
  <p>Can you leave? {{canLeave ? "Yes!" : "Nope"}}</p>
  <button (click)="toggleCanLeave()">Toggle canLeave</button>
</div>
